name: Build MinimalZero OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # позволяет запускать вручную из вкладки Actions

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-22.04  # <--- ИСПОЛЬЗУЕМ СТАБИЛЬНУЮ 22.04 ВМЕСТО ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            nasm \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools \
            make \
            binutils \
            python3 python3-pip
          
          # Устанавливаем Pillow для работы скрипта картинок
          pip3 install --quiet --break-system-packages Pillow

      - name: Verify toolchain
        run: |
          g++ --version
          nasm -v
          grub-mkrescue --version

      - name: Build
        run: |
          make clean
          make

      - name: Check artifacts
        run: |
          ls -lh kernel.bin || echo "kernel.bin not found!"
          ls -lh *.iso || echo "ISO not found!"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: imimi-iso
          path: "*.iso"
          if-no-files-found: error
