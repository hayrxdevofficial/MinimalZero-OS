# ---- Скрываем меню полностью ----
set timeout=0
set timeout_style=hidden
set default=0

# ---- Тихая загрузка (без сообщений) ----
set quiet=1
set debug=0

# ---- Настраиваем видео ----
insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,1280x720x32,800x600x32,auto
set gfxpayload=keep
terminal_output gfxterm

# ---- Красим меню в черный, чтобы даже мигания не было видно ----
set menu_color_normal=black/black
set menu_color_highlight=black/black

# ---- Пункт загрузки ----
menuentry "iMimi OS" --class os --id imimi {
    multiboot /boot/kernel.bin
    boot
}
